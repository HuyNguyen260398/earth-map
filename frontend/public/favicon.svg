<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Earth tab icon, in the vein of the 🌍 emoji: flat blue ocean, flat green
       land, no strokes or shading. Detail is kept coarse on purpose — at 16px
       the browser reduces this to a green mass on blue, which is exactly what
       the emoji does at that size, so extra coastline only adds mush. -->
  <circle cx="16" cy="16" r="15" fill="#5dadec" />
  <g fill="#77b255">
    <!-- Eurasia. The ragged coast matters: a smooth outline here reads as a
         leaf rather than a continent. -->
    <path d="M8.8 9.6
             C8.8 8.2 10.2 7.2 11.6 6.8
             C12.2 5.6 13.4 5.2 14.2 6.0
             C15.2 5.4 16.6 5.0 18.4 5.0
             C20.8 5.0 23.2 5.6 25.2 6.8
             C26.6 7.6 27.8 8.4 28.6 9.4
             C27.6 10.0 26.4 9.8 25.2 10.4
             C24.2 10.9 23.4 10.4 22.4 10.7
             C21.0 11.0 19.4 10.4 17.8 10.8
             C16.2 11.1 14.6 10.4 13.0 10.8
             C11.4 11.1 9.6 10.8 8.8 9.6 Z" />
    <!-- Africa. The west bulge and the Gulf of Guinea notch under it are what
         make the silhouette readable; without them it flattens into a
         downward arrow. -->
    <path d="M9.9 12.4
             C12.0 11.8 14.6 11.6 16.6 11.7
             C18.4 11.8 19.6 12.0 20.4 12.3
             C21.5 13.1 22.2 14.2 23.3 15.5
             C23.6 16.3 22.4 16.7 21.1 17.2
             C20.6 18.6 20.0 20.1 19.1 21.9
             C18.4 23.3 17.5 24.5 16.4 25.2
             C15.4 24.5 14.6 23.2 14.0 21.8
             C13.4 20.5 13.0 19.3 13.1 18.1
             C11.9 17.5 10.4 17.0 9.4 16.1
             C8.6 15.1 8.6 13.3 9.9 12.4 Z" />
    <!-- Arabia, filling the gap between Eurasia and the Horn. -->
    <path d="M22.6 11.8
             C23.9 11.2 25.4 11.5 26.2 12.5
             C25.8 13.8 24.4 14.4 23.2 14.0
             C22.5 13.5 22.3 12.6 22.6 11.8 Z" />
    <!-- Madagascar -->
    <path d="M21.0 20.2
             C21.9 21.0 22.2 22.4 21.6 23.5
             C20.8 22.8 20.5 21.2 21.0 20.2 Z" />
    <!-- South America, clipped by the western limb. -->
    <path d="M4.4 18.4
             C5.6 18.8 6.1 20.1 5.8 21.6
             C5.4 23.2 4.7 24.3 3.8 24.9
             C2.9 23.2 2.5 21.3 2.8 19.5
             C3.2 18.7 3.8 18.3 4.4 18.4 Z" />
  </g>
</svg>
